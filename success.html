<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | BHADEX PLUGS</title><style>body{margin:0;background:#080809;color:#f7f7fa;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;margin:20px;padding:32px;border:1px solid #333;border-radius:24px;background:#151518;text-align:center}.btn{display:inline-block;background:#ff2538;color:white;text-decoration:none;padding:14px 20px;border-radius:12px;font-weight:bold}</style><div class="card"><h1 id="title">Checking payment…</h1><p id="msg">Please wait while we confirm your payment with Paystack.</p><a class="btn" href="https://wa.me/233249532964?text=Hello%20Bhadex%20Plugs%2C%20I%20want%20to%20order">Contact us on WhatsApp</a><p><a href="/" style="color:#ff8996">Return to store</a></p></div><script>const p=new URLSearchParams(location.search),ref=p.get('reference')||p.get('trxref');if(ref){fetch('/.netlify/functions/verify-payment?reference='+encodeURIComponent(ref)).then(r=>r.json()).then(x=>{document.getElementById('title').textContent=x.paid?'Payment confirmed':'Payment not confirmed';document.getElementById('msg').textContent=x.paid?'Order Received! We will deliver via WhatsApp shortly.':(x.message||'Please contact support before placing another payment.');}).catch(()=>document.getElementById('msg').textContent='Could not verify right now. Contact support with your payment reference.')}else{document.getElementById('title').textContent='No payment reference';document.getElementById('msg').textContent='Please contact support if you completed a payment.'}</script></html>
